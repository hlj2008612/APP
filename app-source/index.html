<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>美琴的照片墙</title>
    <meta name="description" content="美琴的照片墙" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / 社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="美琴的照片墙" />

    <meta name="twitter:title" content="美琴的照片墙" />

    <!--
      内联深色底色：CSS 是异步加载的，若等它到达再上色会先闪一帧白屏。
      这里把 html/body 的底色在首字节就定死（与 src/assets/main.css 的 --bg 一致）。
      注意：不要给 <img> 加 rel=preload —— 缩略图最大约 1.1 MB，预加载会抢首屏带宽。
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #0d0d0d; color-scheme: dark; }
      #app { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
